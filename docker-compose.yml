# Local demo: Apache NiFi + nifipilot-plus as a sidecar.
#
# The `mcp` container joins NiFi's network namespace (network_mode: service:nifi), exactly like
# a sidecar container in a Kubernetes Pod: it reaches NiFi at https://localhost:8443 and no
# NiFi port has to be exposed to a shared network. Because the namespace is shared, every
# published port is declared on the `nifi` service.
#
# Copy .env.example to .env first (NIFI_PASSWORD must be >= 12 characters).
# Pick another NiFi release with NIFI_VERSION (default below).
services:
  nifi:
    image: apache/nifi:${NIFI_VERSION:-2.11.0}
    ports:
      - "127.0.0.1:8443:8443" # NiFi UI/API
      - "127.0.0.1:8000:8000" # MCP endpoint (belongs to the sidecar; it has no authentication)
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:-admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?Set NIFI_PASSWORD (min 12 chars) in .env}
      # Listen on every interface so the sidecar can use localhost (default: container hostname)
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      # NiFi validates the Host header: list every host:port used to reach it
      NIFI_WEB_PROXY_HOST: localhost:8443
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/nifi-api/access/config | grep -qE '(200|401)'"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s

  mcp:
    build: .
    network_mode: "service:nifi" # sidecar: same network namespace as NiFi
    environment:
      NIFI_URL: https://localhost:8443
      NIFI_USERNAME: ${NIFI_USERNAME:-admin}
      NIFI_PASSWORD: ${NIFI_PASSWORD}
      NIFI_VERIFY_SSL: "false" # NiFi's generated certificate is self-signed
      MCP_MODE: ${MCP_MODE:-readonly}
      MCP_TOOLSETS: ${MCP_TOOLSETS:-all}
      MCP_DRY_RUN: ${MCP_DRY_RUN:-false}
    depends_on:
      nifi:
        condition: service_healthy
