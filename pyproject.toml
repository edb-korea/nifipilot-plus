[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nifipilot-plus"
version = "0.1.0"
description = "MCP server for Apache NiFi (1.x/2.x): inspect, build and operate flows from AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
nifipilot-plus = "nifipilot_plus.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nifipilot_plus"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/nifipilot_plus/guides/flow_builder.py", "src/nifipilot_plus/guides/best_practices.py", "src/nifipilot_plus/guides/jdbc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
